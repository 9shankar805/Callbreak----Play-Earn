name: callbreak
description: Callbreak - Offline Card Game with Bot AI
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  audioplayers: ^6.1.0

  # ── Online multiplayer ──────────────────────────────────────────────────────
  web_socket_channel: ^3.0.1        # WebSocket client
  firebase_core: ^3.6.0             # Firebase bootstrap
  firebase_auth: ^5.3.1             # Anonymous + display-name auth
  shared_preferences: ^2.3.2        # Persist display name / avatar choice
  uuid: ^4.5.1                      # Generate local player IDs

  # ── Animations ──────────────────────────────────────────────────────────────
  lottie: ^3.1.3                    # Lottie JSON animations (coin spin, rewards)

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/sounds/bg_music.mp3
    - assets/sounds/bg_music_table.ogg
    - assets/sounds/lose.mp3
    - assets/images/
    - assets/images/avatars/
    - assets/cards/
    - assets/lottie/
